<!DOCTYPE html>
<html>
    <head>
        <title>Shodan Search</title>
        <style>
            body, form{
                margin:20px auto;
                max-width:900px;
                overflow-x:hidden;
                font-family:Arial, Helvetica, sans-serif;
            }

            fieldset{
                display:flex;
                flex-direction:column;
                gap:12px;
                padding:16px;
            }

            input#query,
            input#spreadsheet_id{
                min-width:340px;
            }
        </style>
    </head>

    <body>
        <h1>Shodan API Search</h1>

        <form action="search" method="get">
            <fieldset>
                <legend>Search Shodan</legend>

                <label for="query">Query:</label>
                <input id="query" name="query" type="text" required />

                <label for="spreadsheet_id">Spreadsheet ID (optional):</label>
                <input id="spreadsheet_id" name="spreadsheet_id" type="text" />

                <input type="submit" value="Search" />
            </fieldset>
        </form>
    </body>
</html>
